# Copy these two units to /etc/systemd/system/ on the VPS, then run:
#   sudo systemctl daemon-reload
#   sudo systemctl enable --now hermes3d-restic-backup.timer

# /etc/systemd/system/hermes3d-restic-backup.service
[Unit]
Description=Hermes3D VPS Restic backup to Backblaze B2
Wants=docker.service
After=docker.service network-online.target

[Service]
Type=oneshot
EnvironmentFile=/etc/hermes/restic.env
ExecStart=/opt/hermes3d/restic-backup.sh
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7

# /etc/systemd/system/hermes3d-restic-backup.timer
[Unit]
Description=Run Hermes3D VPS Restic backup nightly

[Timer]
OnCalendar=*-*-* 03:30:00 UTC
Persistent=true
RandomizedDelaySec=15m

[Install]
WantedBy=timers.target
