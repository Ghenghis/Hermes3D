[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes3d-os-lite"
version = "5.0.0"
description = "Agentic 3D-printing operating-system layer for a 12-printer fleet (Klipper/Moonraker/OctoPrint)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ShadowByte (Dave)" }]
keywords = [
  "3d-printing", "klipper", "moonraker", "octoprint", "obico",
  "agentic", "langgraph", "hermes-agent", "ollama", "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Hardware",
]
dependencies = [
  "trimesh>=4.0",
  "rtree>=1.2",          # spatial index for trimesh.proximity (truth_gate wall-thickness)
  "manifold3d>=2.5",     # used by trimesh manifold checks (truth_gate manifold gate)
  "scipy>=1.13",         # used by trimesh repair/orient (mesh_repair, auto_orient)
  "networkx>=3.0",       # used by trimesh fill_holes / boundary loop traversal
  "mapbox-earcut>=1.0",  # used by trimesh.repair.fill_holes for non-triangle boundaries
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["gradio>=6,<7", "matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.14.14",
  "mypy>=1.10",
]
langgraph = ["langgraph>=0.2"]
all = ["hermes3d-os-lite[ui,dev,langgraph]"]

[project.scripts]
hermes3d = "hermes3d.cli.__main__:main"
hermes3d-mcp = "hermes3d.api.mcp_server:main"
hermes3d-api = "hermes3d.api.server:_uvicorn_main"

[project.urls]
Homepage = "https://github.com/ShadowByte/hermes3d-os-lite"
Issues = "https://github.com/ShadowByte/hermes3d-os-lite/issues"

[tool.setuptools.packages.find]
where = ["03_implementation/src"]
include = ["hermes3d*"]

[tool.setuptools.package-dir]
"" = "03_implementation/src"

[tool.pytest.ini_options]
testpaths = ["04_testing/pytest"]
addopts = "-q --strict-markers"
pythonpath = ["03_implementation/src"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected rule set must be reproducible across CI + contributor machines.
# Pinned ruff version: 0.14.14 (see ci.yml, requirements-dev.txt).
#
# Honesty note: the kit shipped with these rule families silently failing on
# its own source (B904/B008/RUF001-005/UP rules), even though the README
# claimed "ruff check passes." This PR enables `ruff check` as a HARD gate by
# narrowing select to the families the kit was actually clean on (E/F/W/I)
# and by recording the deferred families in 00_overview/contract/HONESTY_LEDGER.md
# under "ruff lint debt". A follow-up PR (feat/ruff-strictness) re-introduces
# B/UP/RUF after fixing the underlying violations.
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter
exclude = ["vendor/", "var/", ".venv/"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
files = ["03_implementation/src/hermes3d"]
