role: qa
description: Runs the full pytest suite and Playwright end-to-end tests, gating on 100% pass. Captures reports and screenshots into var/qa/.
model: sonnet
inputs:
  - name: pr_diff
    type: diff
    required: true
    description: Unified diff produced by the implementer role.
  - name: branch_name
    type: string
    required: true
    description: Branch under test.
action_sequence:
  - run: mkdir -p var/qa
  - run: bash scripts/truth-gate.sh
outputs:
  - path: var/truth-gate/
    description: Per-run dir with logs + signed proof bundle (one zip per run).
  - artifact: signed_proof_bundle
    description: HMAC-signed zip aggregating pytest report, acceptance results, Playwright report (advisory), forbidden-pattern log, evidence ledger, and manifest with file-level sha256s.
gates:
  - name: truth_gate_green
    threshold: exit 0
    blocking: true
    command: bash scripts/truth-gate.sh
  - name: bundle_signature_verifies
    threshold: exit 0
    blocking: true
    command: python 05_truth_proof/conformance_runner.py --bundle var/truth-gate/*/*.zip
retry_policy:
  max_retries: 3
  backoff_strategy: exponential
  initial_delay_seconds: 10
escalate_to: repair
