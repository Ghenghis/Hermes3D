name: ci

# Top-level CI for Hermes3D — runs from repo root after the A.1 restructure.
# Layout reference: see root README.md "Repository layout".
#
# Matrix: Windows + Ubuntu × Python 3.11 + 3.12.

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  layer_a_static_gates:
    name: Layer A — static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff + mypy
        # Pin ruff to a specific version — formatter rules drift across minor
        # releases (0.14 -> 0.15 reformatted dashboard.py). Bump deliberately
        # via a dedicated PR that includes the format diff.
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.14.14' mypy
      - name: ruff format --check
        run: ruff format --check 03_implementation/src 04_testing/pytest
      - name: ruff check
        run: ruff check 03_implementation/src 04_testing/pytest
      - name: forbidden-pattern scan
        run: python scripts/scaffolding/forbidden_pattern_scan.py
      - name: mypy --strict (advisory)
        run: |
          pip install -r requirements.txt
          mypy --strict --no-incremental 03_implementation/src/hermes3d || echo "mypy advisory in v5; v5.1 promotes to hard gate"

  layer_b_smoke_and_acceptance:
    name: "Layer B — smoke + acceptance (${{ matrix.os }} × py${{ matrix.python-version }})"
    needs: layer_a_static_gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      HERMES3D_PROOF_KEY: hermes3d-default-proof-key-not-secret
      # Force UTF-8 stdout so unicode box-drawing chars in the acceptance
      # runner ('━' etc.) don't crash on Windows cp1252.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install editable package
        run: pip install -e .
      - name: pytest (unit + conformance)
        run: pytest 04_testing/pytest/unit 04_testing/pytest/conformance -v --maxfail=5
      - name: Acceptance runner
        run: python 04_testing/acceptance/run_acceptance.py

  layer_c_integration:
    name: Layer C — integration (Linux only)
    needs: layer_b_smoke_and_acceptance
    runs-on: ubuntu-latest
    env:
      HERMES3D_PROOF_KEY: hermes3d-default-proof-key-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Integration tests
        run: pytest 04_testing/pytest/integration -v

  layer_d_ui_e2e:
    # Playwright + Gradio on Windows runners is too flaky to gate on (port
    # binding, font rendering diffs in screenshot tests, slower process
    # startup blow past the 30s health-check budget). We pin Layer D to
    # Linux + Python 3.11 + Node 24 only.
    #
    # HARD GATE — release-quality standard requires every gate green before
    # any RC tag. The launcher uses defensive kwarg filtering for forward
    # gradio compatibility, and the Playwright specs use stable app-owned
    # selectors (elem_id hooks) rather than framework-internal DOM.
    name: Layer D — UI E2E (Linux × py3.11)
    needs: [layer_a_static_gates, layer_b_smoke_and_acceptance]
    runs-on: ubuntu-latest
    env:
      HERMES3D_PROOF_KEY: hermes3d-default-proof-key-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # Node 24 (current LTS) — Playwright @1.50 is supported on 18/20/22/24.
          # Bumping from 20 to keep CI aligned with contributor toolchains
          # (local dev typically Node 22+/24+) and avoid version-skew in
          # esbuild/jiti/etc. that the older toolchain pulls in.
          node-version: "24"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Install Node dependencies
        working-directory: 04_testing/playwright
        run: npm install
      - name: Install Playwright browsers
        working-directory: 04_testing/playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite (boots FastAPI + Gradio)
        run: bash scripts/run-e2e.sh
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-d-e2e-artifacts
          path: |
            var/e2e-runs/
            04_testing/playwright/playwright-report/
            04_testing/playwright/test-results/
          if-no-files-found: warn

  layer_e_release_dryrun:
    name: Layer E — release dry-run
    needs: layer_b_smoke_and_acceptance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Run release.sh in dry-run mode
        run: bash scripts/scaffolding/release.sh --dry-run
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes3d-os-lite-release
          path: dist/release/**/*

  layer_w_wizard_e2e:
    # Layer W — recorded wizard run on a clean Linux runner, proving the
    # non-coder flow from zero. Quick mode (skips acceptance + UI launch
    # so the job stays under 5 min) is the gate; the full version is for
    # local + release validation. Verifier asserts the transcript actually
    # contains the preflight banner and the env fingerprint is honest.
    name: Layer W — Wizard E2E (Linux × py3.11)
    needs: layer_a_static_gates
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run wizard recording (quick mode)
        run: bash scripts/wizard-record.sh --auto-yes --quick
      - name: Verify recording
        run: |
          LATEST=$(ls -dt var/wizard-runs/*/ | head -1)
          python scripts/verify-wizard-recording.py "$LATEST"
      - name: Upload wizard transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-recording
          path: var/wizard-runs/
          if-no-files-found: warn

  honesty_gates:
    name: Layer F — honesty gates
    needs: layer_a_static_gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate manifest
        run: python 00_overview/contract/_generate_manifest.py
      - name: Honesty diff
        run: python scripts/scaffolding/honesty_diff.py
      - name: README claim audit (advisory)
        run: python scripts/scaffolding/readme_claim_audit.py

  layer_t_truth_gate:
    # Unified truth pipeline: every gate above into ONE signed bundle.
    # Reviewers can download the artifact and inspect the full evidence
    # trail in a single zip.
    name: Layer T — Unified Truth Gate (Linux × py3.11)
    needs: [layer_a_static_gates, layer_b_smoke_and_acceptance, layer_c_integration, honesty_gates]
    runs-on: ubuntu-latest
    env:
      HERMES3D_PROOF_KEY: hermes3d-default-proof-key-not-secret
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run unified truth gate
        run: bash scripts/truth-gate.sh
      - name: Upload truth-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-gate-bundle
          path: |
            var/truth-gate/
          if-no-files-found: warn
