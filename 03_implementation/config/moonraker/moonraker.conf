# Moonraker.conf starter — works for all 12 printers in the Hermes3D fleet.
# Drop into the printer's config directory alongside printer.cfg, edit the
# trusted_clients section to match your LAN, and start the moonraker service.
#
# Reference: https://moonraker.readthedocs.io/en/latest/installation/
# Stack assumed: Klipper + Moonraker + (Fluidd OR Mainsail) + Nginx

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /tmp/klippy_uds
max_upload_size: 1024            # MB; large g-code files upload fine

[file_manager]
enable_object_processing: True
queue_gcode_uploads: False
file_system_observer: inotify

[machine]
provider: systemd_dbus

[authorization]
trusted_clients:
    127.0.0.1
    10.0.0.0/8
    192.168.0.0/16
    172.16.0.0/12
    FE80::/10
    ::1/128
cors_domains:
    *.local
    *.lan
    *://app.fluidd.xyz
    *://my.mainsail.xyz
    *://localhost:*
    *://127.0.0.1:*

# History tracking — useful for the Hermes3D dashboard which tails Moonraker.
[history]

# Allow OctoPrint-style API key auth so the Hermes3D MoonrakerClient can use
# X-Api-Key header. Generate one in Mainsail/Fluidd settings.
[octoprint_compat]

# WebSocket announcements — kept enabled so Hermes3D can subscribe to live
# print progress without polling.
[announcements]
subscriptions:
    fluidd
    mainsail

# Update manager — only manage moonraker itself by default. The user can
# extend this for klipper, fluidd, mainsail, etc.
[update_manager]
refresh_interval: 168
enable_auto_refresh: True

[update_manager moonraker]
type: git_repo
path: ~/moonraker
origin: https://github.com/Arksine/moonraker.git
primary_branch: master
managed_services: moonraker

# ---------------------------------------------------------------------------
# Hermes3D integration
# ---------------------------------------------------------------------------
# This file works unchanged for every printer in
# hermes3d.core.printers.FLEET. Per-printer, only the hostname differs:
#   FLSUN T1 A         -> http://flsun-t1-a.local:7125
#   FLSUN T1 B         -> http://flsun-t1-b.local:7125
#   FLSUN S1           -> http://flsun-s1.local:7125
#   FLSUN V400         -> http://flsun-v400.local:7125
#   FLSUN Super Racer  -> http://flsun-sr.local:7125
#   FLSUN QQ-S Pro     -> http://flsun-qqs-pro.local:7125
#   Creality CR-10S    -> http://creality-cr10s.local:7125
#   Creality CR-6 Max  -> http://creality-cr6max.local:7125
#   Tronxy D01 Pro     -> http://tronxy-d01.local:7125
#   Tronxy X5SA Pro    -> http://tronxy-x5sa.local:7125
#   Prusa MK3S+        -> http://prusa-mk3s.local:7125
#   Sovol SV01         -> http://sovol-sv01.local:7125
# These defaults live in printer_profiles.PrinterProfile.moonraker_url_default.
