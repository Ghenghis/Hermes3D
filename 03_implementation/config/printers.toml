# Hermes3D fleet runtime manifest.
#
# Default values match hermes3d.core.printers.FLEET. To override per-machine
# (e.g. when you've moved a printer to a different VLAN), copy this file to
# `config/printers.user.toml` and edit. The user file is loaded on top of
# the defaults — you only need to declare the fields that differ.
#
# DO NOT EDIT THIS FILE DIRECTLY — it is the source-of-truth shipped with
# the contract kit. Use printers.user.toml for your local overrides.

