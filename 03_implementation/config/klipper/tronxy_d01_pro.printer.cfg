# Klipper printer.cfg starter — Tronxy D01 Pro (CoreXY, enclosed)
# Profile ID: tronxy_d01_pro
# Envelope: 220 x 220 x 220 mm, 120 mm/s, 2000 mm/s²
# Stock board: CXY-V6 (rebadged GD32). For Klipper, flash via SD card.

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_xxxx-if00
restart_method: command

[stepper_x]
step_pin: PE3
dir_pin: !PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: PA15
position_endstop: 0
position_max: 220
homing_speed: 50

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: PA12
position_endstop: 0
position_max: 220
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: PA11
position_endstop: 0
position_max: 220

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.42
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
control: pid
pid_kp: 22.0
pid_ki: 1.1
pid_kd: 110.0
min_temp: 0
max_temp: 280

[heater_bed]
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC0
control: pid
pid_kp: 70.0
pid_ki: 1.5
pid_kd: 950.0
min_temp: 0
max_temp: 115

[fan]
pin: PB1

[input_shaper]
# CoreXY benefits significantly from input shaping.
shaper_freq_x: 60.0
shaper_type_x: mzv
shaper_freq_y: 60.0
shaper_type_y: mzv

# Hermes3D integration: TruthGateConfig(printer_profile_id="tronxy_d01_pro")
