# Klipper printer.cfg starter — Creality CR-10S (cartesian bed-slinger)
# Profile ID: creality_cr10s
# Envelope: 300 x 300 x 400 mm, 80 mm/s, 1000 mm/s²

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.0
position_max: 400

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114.0
min_temp: 0
max_temp: 265                # CR-10S all-metal optional; stock max ~245

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_kp: 54.0
pid_ki: 0.77
pid_kd: 948.0
min_temp: 0
max_temp: 110

[fan]
pin: PH6

# Hermes3D integration: TruthGateConfig(printer_profile_id="creality_cr10s")
