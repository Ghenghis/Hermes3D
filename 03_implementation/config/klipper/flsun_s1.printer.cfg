# Klipper printer.cfg starter — FLSUN S1 (delta, enclosed, direct drive, LIDAR)
# Profile ID: flsun_s1
# Envelope: Ø320 × 430 mm, 1200 mm/s, 40000 mm/s² (manufacturer-rated)
#
# Reachable Z varies across XY due to delta kinematics — see
# 01-ARCHITECTURE/printer_envelopes.md for the full grid.
# At center: 432mm. At Ø=320 edge: ~383mm.

[printer]
kinematics: delta
max_velocity: 1200
max_accel: 40000
max_z_velocity: 1200
square_corner_velocity: 5.0
minimum_z_position: -5
delta_radius: 175.0          # tune via DELTA_CALIBRATE
print_radius: 160.0          # half of Ø320 bed

[mcu]
serial: /dev/serial/by-id/usb-Klipper_xxxx-if00
restart_method: command

[stepper_a]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC0
microsteps: 32
rotation_distance: 40
endstop_pin: PE10
homing_speed: 60
position_endstop: 432
arm_length: 380

[stepper_b]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
endstop_pin: PE15

[stepper_c]
step_pin: PD7
dir_pin: PB1
enable_pin: !PC2
microsteps: 32
rotation_distance: 40
endstop_pin: PA12

[extruder]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PA15
microsteps: 16
rotation_distance: 4.65      # FLSUN S1 high-flow extruder — CALIBRATE
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_cross_section: 50  # high-flow up to 110 mm³/s
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid
pid_kp: 24.0
pid_ki: 1.2
pid_kd: 120.0
min_temp: 0
max_temp: 355                 # S1 hotend rated 350; +5 margin

[heater_bed]
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC5
control: pid
pid_kp: 70.0
pid_ki: 1.5
pid_kd: 900.0
min_temp: 0
max_temp: 115

[fan]
pin: PE9                     # CPAP turbo blower
max_power: 1.0

[heater_fan hotend_fan]
pin: PE11
heater: extruder
heater_temp: 50.0

[probe]
pin: PA8                     # LIDAR/inductive probe
x_offset: 0
y_offset: 0
z_offset: 0                  # set via PROBE_CALIBRATE
speed: 5.0
samples: 3
samples_tolerance: 0.05

[delta_calibrate]
radius: 130
horizontal_move_z: 5

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_radius: 140
mesh_origin: 0,0
round_probe_count: 7
algorithm: bicubic

[input_shaper]
shaper_freq_x: 60.0
shaper_type_x: mzv
shaper_freq_y: 60.0
shaper_type_y: mzv

# ---------------------------------------------------------------------------
# Hermes3D integration: TruthGateConfig(printer_profile_id="flsun_s1")
# Moonraker URL default: http://flsun-s1.local
# Note: model envelope NOT a perfect cylinder; the contract kit's Truth Gate
# uses a circular xy bed-fit check at the conservative diameter (320mm).
