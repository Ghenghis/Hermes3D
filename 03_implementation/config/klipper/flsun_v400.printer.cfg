# Klipper printer.cfg starter — FLSUN V400 (delta, open frame, direct drive)
# Profile ID: flsun_v400
# Envelope: Ø300 × 410 mm, 600 mm/s, 25000 mm/s²
# Stock board: MKS Robin Nano V2.1 with Speeder Pad (Klipper preinstalled)

[printer]
kinematics: delta
max_velocity: 600
max_accel: 25000
max_z_velocity: 600
square_corner_velocity: 5.0
minimum_z_position: -5
delta_radius: 158.0
print_radius: 150.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_xxxx-if00
restart_method: command

[stepper_a]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: PA15
homing_speed: 50
position_endstop: 412
arm_length: 360

[stepper_b]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: PA12

[stepper_c]
step_pin: PB5
dir_pin: PB3
enable_pin: !PB8
microsteps: 16
rotation_distance: 40
endstop_pin: PA8

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB4
microsteps: 16
rotation_distance: 7.42
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
control: pid
pid_kp: 25.0
pid_ki: 1.4
pid_kd: 100.0
min_temp: 0
max_temp: 305

[heater_bed]
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC0
control: pid
pid_kp: 75.0
pid_ki: 1.5
pid_kd: 950.0
min_temp: 0
max_temp: 115

[fan]
pin: PB1

[probe]
pin: !PA11
x_offset: 0
y_offset: 0
z_offset: 0
speed: 8.0

[delta_calibrate]
radius: 120
horizontal_move_z: 5

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_radius: 130
mesh_origin: 0,0
round_probe_count: 5
algorithm: bicubic

[input_shaper]
shaper_freq_x: 55.0
shaper_type_x: mzv
shaper_freq_y: 55.0
shaper_type_y: mzv

# Hermes3D integration: TruthGateConfig(printer_profile_id="flsun_v400")
