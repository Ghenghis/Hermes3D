# Klipper printer.cfg starter — Prusa MK3S+ (cartesian, direct drive)
# Profile ID: prusa_mk3s
# Envelope: 250 x 210 x 210 mm, 200 mm/s, 2500 mm/s²
# Reference: github.com/dz0ny/klipper-mk3 (community Klipper port for MK3S)

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2500
max_z_velocity: 12
max_z_accel: 200
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-Prusa_Multi-Material_2.0_*-if00
restart_method: command

[stepper_x]
step_pin: PD6
dir_pin: PD7
enable_pin: !PB4
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_max: 250
homing_speed: 50

[stepper_y]
step_pin: PB5
dir_pin: PB6
enable_pin: !PB4
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -2
position_min: -2
position_max: 210
homing_speed: 50

[stepper_z]
step_pin: PD2
dir_pin: !PD3
enable_pin: !PB4
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 210

[extruder]
step_pin: PD0
dir_pin: !PD1
enable_pin: !PB4
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF0
control: pid
pid_kp: 16.13
pid_ki: 1.1625
pid_kd: 56.23
min_temp: 0
max_temp: 305                # MK3S hotend rated 300

[heater_bed]
heater_pin: PG5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF2
control: pid
pid_kp: 126.13
pid_ki: 4.3
pid_kd: 924.0
min_temp: 0
max_temp: 125                # MK3S bed rated 120

[probe]
# SuperPINDA inductive probe — does NOT need calibration; thermally stable.
pin: ^!PB4
x_offset: 23
y_offset: 5
z_offset: 1.0                # from your manual probe-calibrate
speed: 4.0
samples: 3

[bed_mesh]
speed: 100
mesh_min: 35, 6
mesh_max: 240, 198
probe_count: 7,7
algorithm: bicubic

[fan]
pin: PH5

[heater_fan hotend_fan]
pin: PH3
heater: extruder
heater_temp: 50.0

[input_shaper]
# MK3S benefits from input shaping; SHAPER_CALIBRATE recommended.
shaper_freq_x: 50.0
shaper_type_x: mzv
shaper_freq_y: 40.0
shaper_type_y: mzv

# Hermes3D integration: TruthGateConfig(printer_profile_id="prusa_mk3s")
