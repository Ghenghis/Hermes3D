default_mode: template
# ADR-015: lm_studio + ollama are the local on-ramps; minimax / deepseek
# remain on the allowlist for the paid-fallback path. hipfire only routes
# traffic when HERMES3D_AMD_NODE=1 is set (HipfireProvider enforces this).
provider_allowlist: [openai-fixture, lm_studio, ollama, hipfire, minimax, deepseek]
cost_cap_usd_per_run: 0.05
cost_cap_usd_per_day: 1.00
timeout_seconds: 30
prompt_max_bytes: 4096
retry_max: 1
rate_per_second: 1
input_usd_per_token: 0.000001
output_usd_per_token: 0.000001
max_completion_tokens: 1024
fallback_mode: template

providers:
  minimax:
    base_url: https://api.minimax.io/v1
    probe_path: /models
    completion_path: /chat/completions
    # MiniMax highspeed token-plan keys are exclusive to the Token Plan
    # product. Hermes prefers HERMES3D_MINIMAX_TOKEN_PLAN_API_KEY /
    # MINIMAX_TOKEN_PLAN_API_KEY when present, then falls back to this
    # standard key name for older configs.
    api_key_env: HERMES3D_MINIMAX_API_KEY
    cost_cap_usd_per_run: 0.05
    cost_cap_usd_per_day: 1.00
  deepseek:
    base_url: https://api.deepseek.com/v1
    probe_path: /models
    completion_path: /chat/completions
    api_key_env: HERMES3D_DEEPSEEK_API_KEY
    cost_cap_usd_per_run: 0.05
    cost_cap_usd_per_day: 1.00
  # ---- ADR-015 local providers --------------------------------------------
  lm_studio:
    base_url: http://127.0.0.1:1234/v1
    probe_path: /models
    completion_path: /chat/completions
    # Local LM Studio doesn't require a key. HERMES3D_NULL_API_KEY is the
    # conventional placeholder so the api_key_env pattern is satisfied
    # without storing a real secret.
    api_key_env: HERMES3D_NULL_API_KEY
    cost_cap_usd_per_run: 0.001
    cost_cap_usd_per_day: 0.01
  hipfire:
    # Optional AMD inference node. Only reachable when HERMES3D_AMD_NODE=1
    # is set; HipfireProvider refuses to instantiate otherwise so a stray
    # entry here does NOT silently route traffic on a non-AMD host.
    base_url: http://127.0.0.1:11435/v1
    probe_path: /models
    completion_path: /chat/completions
    api_key_env: HERMES3D_NULL_API_KEY
    cost_cap_usd_per_run: 0.001
    cost_cap_usd_per_day: 0.01
probe_freshness_minutes: 15
probe_budget_usd_per_day: 0.10
probe_rate_per_minute: 1
