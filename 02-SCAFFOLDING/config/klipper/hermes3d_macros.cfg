# =============================================================================
# Hermes3D-OS Lite — Klipper Macro Library
# =============================================================================
#
# Status: runnable
# Contract: 00-CONTRACT/MASTER_CONTRACT.md §25 (Klipper Macros)
#
# Drop this file into your Klipper config directory and add to printer.cfg:
#
#     [include hermes3d_macros.cfg]
#
# Provides:
#   - START_PRINT EXTRUDER=210 BED=60       — heat/home/purge sequence
#   - END_PRINT                              — park, cool, beep, eject hint
#   - PURGE_LINE                             — single-pass priming line
#   - KAMP_BED_MESH_CALIBRATE                — adaptive mesh near print bbox
#   - PAUSE / RESUME / CANCEL_PRINT          — safer stops with retract
#   - LOAD_FILAMENT / UNLOAD_FILAMENT        — extruder-hot filament moves
#   - HERMES3D_HEALTHCHECK                   — diagnostic block in console
#
# These are deliberately stock-Klipper-compatible. Tested against:
#   - FLSUN T1 / S1 (Klipper stock)
#   - FLSUN V400 (Klipper stock)
#   - Creality CR-10S / CR-6 Max (Klipper port)
#   - Tronxy D01 Pro / X5SA Pro (Klipper port)
#   - Sovol SV01 (Klipper port)
#
# Macros assume:
#   - Bed mesh `default` exists (BED_MESH_PROFILE LOAD=default)
#   - Print start/end positions are valid for the printer (deltas vs. cart.)
# =============================================================================

[gcode_macro START_PRINT]
description: Heat, home, mesh, purge, then begin the print
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}
    M117 Hermes3D: starting print

    # 1. Set heaters (don't wait yet)
    M104 S{EXTRUDER_TEMP} ; nozzle preheat
    M140 S{BED_TEMP}      ; bed preheat
    {% if CHAMBER_TEMP > 0 %}
    M141 S{CHAMBER_TEMP}  ; chamber preheat (skipped if no chamber)
    {% endif %}

    # 2. Home all
    G28

    # 3. Wait for bed (then bed mesh — bed must be at temperature first)
    M190 S{BED_TEMP}

    # 4. Adaptive bed mesh (KAMP-aware: only near the print bbox)
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 5. Heat nozzle to full temperature for purge
    M109 S{EXTRUDER_TEMP}

    # 6. Purge line on the front edge
    PURGE_LINE

    M117 Hermes3D: printing


[gcode_macro END_PRINT]
description: End-of-print: retract, park, cool, beep, eject hint
gcode:
    M400                  ; finish all moves
    G91                   ; relative
    G1 E-2 F1800          ; retract 2mm
    G1 Z10 F600           ; lift 10mm
    G90                   ; absolute
    {% set MAX_X = printer.toolhead.axis_maximum.x|float %}
    {% set MAX_Y = printer.toolhead.axis_maximum.y|float %}
    G1 X{MAX_X - 5} Y{MAX_Y - 5} F6000   ; park rear right
    M104 S0               ; cool nozzle
    M140 S0               ; cool bed
    M84                   ; disable steppers
    M117 Hermes3D: print done
    M300 S440 P200        ; beep (if buzzer present)


[gcode_macro PURGE_LINE]
description: Single-pass priming line on Y=1 at Z=0.3
gcode:
    {% set MAX_X = printer.toolhead.axis_maximum.x|float %}
    G92 E0
    G1 Z0.3 F600
    G1 X20 Y1 F6000
    G1 X{MAX_X - 20} Y1 E20 F1500    ; deposit 20mm of filament
    G92 E0
    G1 Z2 F600


[gcode_macro KAMP_BED_MESH_CALIBRATE]
description: Adaptive bed mesh — wrapper around BED_MESH_CALIBRATE ADAPTIVE=1
gcode:
    BED_MESH_CALIBRATE ADAPTIVE=1


[gcode_macro PAUSE]
description: Pause + retract + park
rename_existing: BASE_PAUSE
variable_extrude: 1.0
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set MAX_X = printer.toolhead.axis_maximum.x|float %}
    {% set MAX_Y = printer.toolhead.axis_maximum.y|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z10
    G90
    G1 X{MAX_X / 2} Y{MAX_Y - 5} F6000


[gcode_macro RESUME]
description: Resume from PAUSE — re-prime, restore state
rename_existing: BASE_RESUME
gcode:
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME


[gcode_macro CANCEL_PRINT]
description: Cancel the print — heat off, park, drop bed
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M84
    M117 Hermes3D: cancelled
    BASE_CANCEL_PRINT


[gcode_macro LOAD_FILAMENT]
description: Load filament — heat to LOAD_TEMP, extrude PURGE_LEN
gcode:
    {% set LOAD_TEMP = params.TEMP|default(210)|float %}
    {% set PURGE_LEN = params.LEN|default(75)|float %}
    M109 S{LOAD_TEMP}
    G91
    G1 E{PURGE_LEN} F300
    G90
    M117 Hermes3D: filament loaded


[gcode_macro UNLOAD_FILAMENT]
description: Unload — fast retract after a tip-shaping wiggle
gcode:
    {% set UNLOAD_TEMP = params.TEMP|default(210)|float %}
    M109 S{UNLOAD_TEMP}
    G91
    G1 E5 F300
    G1 E-3 F500
    G1 E2 F500
    G1 E-100 F1500
    G90
    M117 Hermes3D: filament unloaded


[gcode_macro HERMES3D_HEALTHCHECK]
description: Console diagnostic — prints firmware/version/state info
gcode:
    {action_respond_info("Hermes3D Healthcheck")}
    {action_respond_info("  Klippy state: " ~ printer.idle_timeout.state)}
    {action_respond_info("  Hotend: " ~ printer.extruder.temperature ~ "/" ~ printer.extruder.target ~ " C")}
    {action_respond_info("  Bed:    " ~ printer.heater_bed.temperature ~ "/" ~ printer.heater_bed.target ~ " C")}
    {action_respond_info("  Z homed: " ~ ('z' in printer.toolhead.homed_axes))}
    {action_respond_info("  Position: " ~ printer.toolhead.position)}
