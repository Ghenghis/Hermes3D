# Klipper printer.cfg starter — FLSUN T1 (delta, enclosed, direct drive)
# Profile ID: flsun_t1_a / flsun_t1_b
# Source: hermes3d.core.printers.printer_profiles.FLEET
#
# This is a STARTER config — it is calibrated against the printer's
# manufacturer-published envelope (Ø260 × 330 mm, 1000 mm/s, 30000 mm/s²)
# but every value below MUST be re-tuned per machine via:
#   - DELTA_CALIBRATE
#   - PROBE_CALIBRATE / BED_MESH_CALIBRATE
#   - PID_CALIBRATE EXTRUDER / HEATER_BED
#   - SHAPER_CALIBRATE (input shaping)
#
# Firmware target: Klipper master (>=v0.12). Requires Moonraker for upload
# from Hermes3D pipeline.
#
# DO NOT COPY THIS FILE BLINDLY ONTO YOUR PRINTER.
# Read every section, compare against your hardware, calibrate.

[printer]
kinematics: delta
max_velocity: 1000
max_accel: 30000
max_z_velocity: 1000
square_corner_velocity: 5.0
minimum_z_position: -5
delta_radius: 145.0          # tune via DELTA_CALIBRATE
print_radius: 130.0          # half of bed diameter

[mcu]
# UPDATE: use `ls /dev/serial/by-id/*` on the host to find the real ID.
serial: /dev/serial/by-id/usb-Klipper_xxxx-if00
restart_method: command

[stepper_a]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC0
microsteps: 32
rotation_distance: 40
endstop_pin: PE10
homing_speed: 50
position_endstop: 332         # tune via DELTA_CALIBRATE; ~Z height + offset
arm_length: 320

[stepper_b]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
endstop_pin: PE15

[stepper_c]
step_pin: PD7
dir_pin: PB1
enable_pin: !PC2
microsteps: 32
rotation_distance: 40
endstop_pin: PA12

[extruder]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PA15
microsteps: 16
rotation_distance: 7.5      # FLSUN T1 dual-gear direct drive — re-calibrate!
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid                 # run PID_CALIBRATE EXTRUDER TARGET=240 first
pid_kp: 26.0
pid_ki: 1.5
pid_kd: 110.0
min_temp: 0
max_temp: 305                # T1 hotend max 300; +5 for safety margin

[heater_bed]
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC5
control: pid
pid_kp: 70.0
pid_ki: 1.5
pid_kd: 900.0
min_temp: 0
max_temp: 115                # T1 bed max 110; +5 margin

[fan]
pin: PE9                     # part-cooling

[heater_fan hotend_fan]
pin: PE11
heater: extruder
heater_temp: 50.0

[probe]
pin: PA8
x_offset: 0
y_offset: 0
z_offset: 0                  # set via PROBE_CALIBRATE
speed: 8.0
samples: 3
samples_tolerance: 0.05

[delta_calibrate]
radius: 100
horizontal_move_z: 5

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_radius: 110
mesh_origin: 0,0
round_probe_count: 5
algorithm: bicubic

[input_shaper]
# Run SHAPER_CALIBRATE; copy the recommendation here.
shaper_freq_x: 50.0
shaper_type_x: ei
shaper_freq_y: 50.0
shaper_type_y: ei

[pressure_advance]
# Set per-filament via SET_PRESSURE_ADVANCE.

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    M140 S{BED_TEMP}
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    BED_MESH_PROFILE LOAD=default
    G1 Z5 F3000
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M104 S0
    M140 S0
    G91
    G1 Z10 F3000
    G90
    G28
    M84

# ---------------------------------------------------------------------------
# Hermes3D integration
# ---------------------------------------------------------------------------
# This printer is registered in hermes3d.core.printers.FLEET as profile_id
# "flsun_t1_a" (or "flsun_t1_b" for the second unit). The Hermes3D Truth Gate
# validates models against this profile via:
#   TruthGateConfig(printer_profile_id="flsun_t1_a")
# Sliced .gcode is uploaded via Moonraker:
#   MoonrakerClient("http://flsun-t1-a.local").upload_gcode(path, start_print=True)
