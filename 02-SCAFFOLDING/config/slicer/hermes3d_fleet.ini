# ===========================================================================
# Hermes3D pipeline integration
# ===========================================================================
# After importing this bundle in PrusaSlicer/OrcaSlicer:
#   1. Pick the printer that matches the target machine.
#   2. Slice your model.
#   3. Either save the .gcode locally and run:
#        python -m hermes3d.cli upload --printer flsun_t1_a --gcode out.gcode
#      ...or use the Gradio UI's "Slice & Print" tab once configured.
#
# The slicer wrapper (hermes3d.core.slicer.slicer_runner) will pick the
# correct profile automatically when you pass --printer-profile <profile_id>.
