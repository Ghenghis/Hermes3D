# PrusaSlicer / OrcaSlicer / SuperSlicer printer-profile bundle for the
# Hermes3D fleet. Import via PrusaSlicer's `File > Import > Import Config Bundle`.
#
# Generated from hermes3d.core.printers.printer_profiles.FLEET — values match
# the PrinterProfile dataclass exactly.
#
# Profiles deliberately use conservative speeds (50-80% of each printer's
# manufacturer-rated max) so first-print quality is reasonable. Bump speeds
# in your slicer once you have tuned input shaping + flow.

# ---------------------------------------------------------------------------
[printer:Hermes3D - FLSUN QQ-S Pro]
# kinematics: delta, bed Ø255 x H360, hotend 250C, bed 90C
printer_technology = FFF
printer_model = MK3
bed_shape = 0x0,255x0,255x255,0x255  ; PrusaSlicer treats delta as bbox
max_print_height = 360
nozzle_diameter = 0.4
extruder_colour = #FF6B35
default_filament_profile = "Generic PLA @MK3"
single_extruder_multi_material = 0
gcode_flavor = klipper
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 3000
machine_max_acceleration_retracting = 3000
machine_max_acceleration_x = 3000
machine_max_acceleration_y = 3000
machine_max_acceleration_z = 1000
machine_max_feedrate_e = 100
machine_max_feedrate_x = 100
machine_max_feedrate_y = 100
machine_max_feedrate_z = 100
start_gcode = M104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z5 F300\nG92 E0
end_gcode = M104 S0\nM140 S0\nG28 X0\nM84

# ---------------------------------------------------------------------------
[printer:Hermes3D - FLSUN T1 (A)]
# kinematics: delta enclosed, bed Ø260 x H330, hotend 300C, bed 110C, 1000 mm/s
printer_technology = FFF
printer_model = MK3
bed_shape = 0x0,260x0,260x260,0x260
max_print_height = 330
nozzle_diameter = 0.4
gcode_flavor = klipper
machine_max_acceleration_extruding = 30000
machine_max_acceleration_x = 30000
machine_max_acceleration_y = 30000
machine_max_acceleration_z = 1000
machine_max_feedrate_x = 1000
machine_max_feedrate_y = 1000
machine_max_feedrate_z = 1000
start_gcode = START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT

# ---------------------------------------------------------------------------
[printer:Hermes3D - FLSUN T1 (B)]
inherits = Hermes3D - FLSUN T1 (A)

